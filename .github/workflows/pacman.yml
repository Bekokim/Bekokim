name: Generate contribution graph animations

on:
  schedule:
    # раз в сутки
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Тетрис — фигуры падают на клетки коммитов
      - name: Generate Tetris SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Доступно: pacman, tetris, snake, breakout, galaga,
          #           puzzle-bobble, bomberman, minesweeper
          games: "tetris"
          hide_month_labels: "false"

      # Классическая змейка: ползёт по графу, ест коммиты и растёт
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?color_snake=#00FF41&color_dots=#161B22,#003B00,#00661F,#00B32D,#00FF41

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
